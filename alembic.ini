# Developer convenience for the `alembic` command line (e.g. `alembic revision --autogenerate`,
# see src/aranet_monitor/db/migrations/env.py). The app configures Alembic in code and does not
# read this file. The database is the configured one (ARANET_DB_URL / ARANET_DB_SCHEMA).
[alembic]
script_location = %(here)s/src/aranet_monitor/db/migrations
path_separator = os
