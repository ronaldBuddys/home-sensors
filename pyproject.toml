[project]
name = "aranet4-monitor"
version = "0.1.0"
description = "Continuous logger, storage and dashboard for Aranet4 (and other Aranet) BLE sensors"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ronald MacEachern" }]
keywords = ["aranet4", "co2", "bluetooth-low-energy", "iot", "raspberry-pi", "fastapi", "plotly-dash", "sqlalchemy", "postgresql", "sqlite"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "aranet4>=2.6.0",
    "bleak>=1.0",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "a2wsgi>=1.10",
    "dash>=3.0",
    "plotly>=6.0",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.20.0",
]

[project.urls]
Homepage = "https://github.com/ronaldBuddys/home-sensors"
Documentation = "https://github.com/ronaldBuddys/home-sensors/tree/main/docs"
Issues = "https://github.com/ronaldBuddys/home-sensors/issues"

[project.scripts]
aranet = "aranet_monitor.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx2>=2.13"]
e2e = [
    "playwright>=1.64.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aranet_monitor"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "D"]
ignore = ["D100", "D104", "D105", "D107", "D203", "D213", "D401"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not e2e'"
markers = [
    "e2e: browser tests (uv run --group e2e pytest -m e2e)",
]
